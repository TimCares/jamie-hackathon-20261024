<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live File View</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --text: #1f2328; --muted: #6e7781; --border: #e4e4e1;
    --add-bg: #e6f6ea; --add-text: #1a7f37; --del-bg: #fdecec; --del-text: #b42318;
    --flash: #ffe58a; --accent: #2f6feb; --live: #1a7f37; --off: #b0b4b9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --panel: #171a1e; --text: #e6e8eb; --muted: #8b949e; --border: #2a2f36;
      --add-bg: #12301c; --add-text: #56d364; --del-bg: #3a1618; --del-text: #f47067;
      --flash: #5c4a00; --accent: #58a6ff; --live: #3fb950; --off: #4d545c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .file { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.live { background: var(--live); }
  .status { color: var(--muted); }
  .stats .add { color: var(--add-text); } .stats .del { color: var(--del-text); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .btn { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px;
         padding: 4px 10px; font: inherit; cursor: pointer; }
  label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  main { padding: 12px 16px 40vh; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; overflow: hidden; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  td { padding: 0 8px; vertical-align: top; }
  td.n { width: 1%; text-align: right; color: var(--muted); user-select: none; white-space: nowrap; }
  td.m { width: 1%; padding: 0 4px; color: var(--muted); user-select: none; }
  td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
  tr.add { background: var(--add-bg); } tr.add td.m { color: var(--add-text); }
  tr.del { background: var(--del-bg); } tr.del td.code { color: var(--del-text); } tr.del td.m { color: var(--del-text); }
  tr.flash td { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  /* File view: where lines were deleted, with nothing added in their place */
  tr.cut td { animation: cut 2.5s ease-out; }
  @keyframes cut { from { box-shadow: inset 0 2px 0 var(--del-text); } to { box-shadow: inset 0 2px 0 transparent; } }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="connection"></span>
  <span class="file" id="file">…</span>
  <span class="status" id="status">connecting…</span>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <span class="seg" role="group" aria-label="Changes to show">
    <button id="view-file">File</button>
    <button id="view-last">Last change</button>
    <button id="view-total">Since start</button>
  </span>
  <label><input type="checkbox" id="follow" checked> Follow changes</label>
  <button class="btn" id="reset" title="Count changes from the current version">Reset start</button>
</header>
<main><table><tbody id="rows"></tbody></table></main>

<script>
  // Rows arrive as [kind, oldLine, newLine, text] with kind "same" | "add" | "del" (see live_view.py).
  // Views: "file" = the current file only (changes flash, no diff), "last" / "total" = diff views.
  let snapshot = null, view = loadView(), flashLines = new Set(), newChange = false, lastVersion = null;
  const $ = (id) => document.getElementById(id);
  const MARK = { same: " ", add: "+", del: "-" };

  function loadView() {
    try { return localStorage.getItem("live-view") || "file"; } catch { return "file"; }
  }

  function fileRows() {
    // The current file: drop deleted lines, show added ones as plain lines, and mark where a deletion was.
    const rows = [];
    let deletedHere = false;
    for (const [kind, , newNo, text] of snapshot.last) {
      if (kind === "del") { deletedHere = true; continue; }
      rows.push({ kind: "same", newNo, text, flash: kind === "add" && flashLines.has(newNo),
                  cut: deletedHere && kind === "same" && newChange });
      deletedHere = false;
    }
    return rows;
  }

  function diffRows() {
    // In "since start", also flash the lines the latest change touched.
    return snapshot[view].map(([kind, oldNo, newNo, text]) => (
      { kind, oldNo, newNo, text, flash: kind === "add" && flashLines.has(newNo), cut: false }));
  }

  function render() {
    if (!snapshot) return;
    const plain = view === "file", rows = plain ? fileRows() : diffRows(), body = $("rows");
    body.textContent = "";
    if (!rows.length) {
      body.innerHTML = '<tr><td class="empty">(empty file)</td></tr>';
      return;
    }
    let firstChange = null;
    for (const row of rows) {
      const tr = document.createElement("tr");
      tr.className = row.kind;
      if (row.flash) tr.classList.add("flash");
      if (row.cut) tr.classList.add("cut");
      const cells = plain ? [["n", row.newNo], ["code", row.text]]
        : [["n", row.oldNo ?? ""], ["n", row.newNo ?? ""], ["m", MARK[row.kind]], ["code", row.text]];
      for (const [cls, value] of cells) {
        const td = document.createElement("td");
        td.className = cls;
        td.textContent = value;
        tr.appendChild(td);
      }
      body.appendChild(tr);
      const changed = plain ? row.flash || row.cut : row.kind !== "same" && (view === "last" || row.flash);
      if (!firstChange && changed) firstChange = tr;
    }
    const total = snapshot.total;
    const added = total.filter((r) => r[0] === "add").length, removed = total.filter((r) => r[0] === "del").length;
    $("stats").innerHTML = added || removed
      ? `since start: <span class="add">+${added}</span> <span class="del">−${removed}</span>` : "";
    if (firstChange && $("follow").checked) firstChange.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function ago(t) {
    if (!t) return "no changes yet";
    const s = Math.round(Date.now() / 1000 - t);
    return s < 2 ? "changed just now" : s < 60 ? `changed ${s}s ago` : `changed ${Math.round(s / 60)}m ago`;
  }

  function connect() {
    const events = new EventSource("/events");
    events.onopen = () => $("dot").classList.add("live");
    events.onerror = () => { $("dot").classList.remove("live"); $("status").textContent = "reconnecting…"; };
    events.onmessage = (e) => {
      snapshot = JSON.parse(e.data);
      newChange = lastVersion !== null && snapshot.version !== lastVersion;
      lastVersion = snapshot.version;
      flashLines = new Set(newChange ? snapshot.last.filter((r) => r[0] === "add").map((r) => r[2]) : []);
      $("file").textContent = snapshot.path;
      document.title = `${snapshot.path.split("/").pop()} · Live File View`;
      $("status").textContent = ago(snapshot.changed_at);
      render();
    };
  }

  function setView(name) {
    view = name;
    for (const v of ["file", "last", "total"]) $(`view-${v}`).classList.toggle("on", v === name);
    try { localStorage.setItem("live-view", name); } catch {}
    flashLines = new Set();
    newChange = false;
    render();
  }

  for (const v of ["file", "last", "total"]) $(`view-${v}`).onclick = () => setView(v);
  setView(view);
  $("reset").onclick = () => fetch("/reset", { method: "POST" });
  setInterval(() => snapshot && ($("status").textContent = ago(snapshot.changed_at)), 1000);
  connect();
</script>
</body>
</html>
